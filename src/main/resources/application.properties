spring.application.name=TypeFlow
server.port=8080

# Default active profile is 'dev' for turnkey operation without external server setup
# Switch to 'mysql' using --spring.profiles.active=mysql or SPRING_PROFILES_ACTIVE=mysql
spring.profiles.default=dev

# Session configuration
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=TYPEFLOW_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# JSON Date Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
